<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLB Viewer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #202020;
        }

        #viewer {
            position: absolute;
            inset: 0;
        }

        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            padding: 12px;
            background: rgba(30, 30, 30, 0.9);
            border-radius: 8px;
            color: white;
            min-width: 220px;
        }

        button {
            padding: 8px 12px;
            cursor: pointer;
            border: 0;
            border-radius: 5px;
        }

        #dropZone {
            margin-top: 10px;
            padding: 15px;
            border: 2px dashed #777;
            border-radius: 6px;
            text-align: center;
            color: #aaa;
        }

        #dropZone.dragover {
            border-color: white;
            color: white;
        }

        #info {
            margin-top: 10px;
            font-size: 13px;
            line-height: 1.5;
            color: #ccc;
        }

        #fileInput {
            display: none;
        }
    </style>
</head>

<body>

    <div id="viewer"></div>

    <div id="ui">
        <button onclick="document.getElementById('fileInput').click()">
            Wczytaj GLB
        </button>

        <input id="fileInput" type="file" accept=".glb">

        <div id="dropZone">
            Przeciągnij tutaj plik GLB
        </div>

        <div id="info">
            Brak modelu
        </div>
    </div>

    <script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('viewer');
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const info = document.getElementById('info');

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x202020);

        const camera = new THREE.PerspectiveCamera(
            60,
            window.innerWidth / window.innerHeight,
            0.01,
            100000
        );

        camera.position.set(5, 5, 5);

        const renderer = new THREE.WebGLRenderer({
            antialias: true
        });

        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1;

        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;

        const ambientLight = new THREE.HemisphereLight(
            0xffffff,
            0x444444,
            2
        );
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(
            0xffffff,
            3
        );
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        const grid = new THREE.GridHelper(100, 100);
        //scene.add(grid);

        const loader = new GLTFLoader();

        let currentModel = null;

        fileInput.addEventListener('change', event => {
            const file = event.target.files[0];

            if (file) {
                loadGLB(file);
            }
        });

        dropZone.addEventListener('dragover', event => {
            event.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', event => {
            event.preventDefault();

            dropZone.classList.remove('dragover');

            const file = event.dataTransfer.files[0];

            if (file && file.name.toLowerCase().endsWith('.glb')) {
                loadGLB(file);
            }
        });

        function loadGLB(file) {
            info.textContent = 'Wczytywanie...';

            const url = URL.createObjectURL(file);

            loader.load(
                url,
                gltf => {
                    URL.revokeObjectURL(url);

                    if (currentModel) {
                        scene.remove(currentModel);
                        disposeObject(currentModel);
                    }

                    currentModel = gltf.scene;
                    scene.add(currentModel);

                    fitCamera(currentModel);
                    updateInfo(currentModel, file);

                    console.log('GLTF:', gltf);
                },
                xhr => {
                    if (xhr.total > 0) {
                        const percent = (xhr.loaded / xhr.total * 100).toFixed(0);
                        info.textContent = `Wczytywanie: ${percent}%`;
                    }
                },
                error => {
                    URL.revokeObjectURL(url);

                    console.error(error);
                    info.textContent = 'Błąd podczas wczytywania GLB';
                }
            );
        }

        function fitCamera(object) {
            const box = new THREE.Box3().setFromObject(object);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());

            const maxSize = Math.max(size.x, size.y, size.z);

            const distance = maxSize / (2 * Math.tan(
                THREE.MathUtils.degToRad(camera.fov / 2)
            ));

            camera.position.set(
                center.x + distance,
                center.y + distance * 0.6,
                center.z + distance
            );

            camera.near = Math.max(maxSize / 100000, 0.000001);
            camera.far = maxSize * 1000;

            camera.updateProjectionMatrix();

            controls.target.copy(center);
            controls.minDistance = maxSize * 0.001;
            controls.maxDistance = maxSize * 100;
            controls.update();
        }

        function updateInfo(object, file) {
            let meshes = 0;
            let triangles = 0;
            let materials = 0;
            let textures = 0;

            const materialSet = new Set();
            const textureSet = new Set();

            object.traverse(node => {
                if (!node.isMesh) {
                    return;
                }

                meshes++;

                if (node.geometry.index) {
                    triangles += node.geometry.index.count / 3;
                } else {
                    triangles += node.geometry.attributes.position.count / 3;
                }

                const nodeMaterials = Array.isArray(node.material)
                    ? node.material
                    : [node.material];

                for (const material of nodeMaterials) {
                    if (!material) {
                        continue;
                    }

                    materialSet.add(material);

                    for (const key of [
                        'map',
                        'normalMap',
                        'roughnessMap',
                        'metalnessMap',
                        'aoMap',
                        'emissiveMap',
                        'alphaMap'
                    ]) {
                        if (material[key]) {
                            textureSet.add(material[key]);
                        }
                    }
                }
            });

            materials = materialSet.size;
            textures = textureSet.size;

            const box = new THREE.Box3().setFromObject(object);
            const size = box.getSize(new THREE.Vector3());

            info.innerHTML = `
        <b>${file.name}</b><br>
        Rozmiar pliku: ${formatBytes(file.size)}<br>
        Meshes: ${meshes}<br>
        Trójkąty: ${Math.round(triangles).toLocaleString()}<br>
        Materiały: ${materials}<br>
        Tekstury: ${textures}<br>
        Rozmiar modelu:<br>
        ${size.x.toFixed(3)} ×
        ${size.y.toFixed(3)} ×
        ${size.z.toFixed(3)}
    `;
        }

        function formatBytes(bytes) {
            if (bytes < 1024) {
                return bytes + ' B';
            }

            if (bytes < 1024 * 1024) {
                return (bytes / 1024).toFixed(1) + ' KB';
            }

            if (bytes < 1024 * 1024 * 1024) {
                return (bytes / 1024 / 1024).toFixed(1) + ' MB';
            }

            return (bytes / 1024 / 1024 / 1024).toFixed(2) + ' GB';
        }

        function disposeObject(object) {
            object.traverse(node => {
                if (node.geometry) {
                    node.geometry.dispose();
                }

                if (node.material) {
                    const materials = Array.isArray(node.material)
                        ? node.material
                        : [node.material];

                    for (const material of materials) {
                        material.dispose();
                    }
                }
            });
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();

            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>

</body>

</html>
